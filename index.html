<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Cora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0f14; --panel: #121821; --ink: #f4f6f8; --muted: #8a94a3; --lime: #d6ff3d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Geist, system-ui, sans-serif; }
  .stage { position: relative; width: 1280px; height: 720px; display: flex; }
  /* Cora's face: a looping "listening" clip, with a "talking" clip faded in while her voice plays. */
  .face { position: relative; width: 720px; height: 720px; flex: none; overflow: hidden; background: #2a2622; }
  .face img, .face video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .face video { opacity: 0; }
  .face video.on { opacity: 1; }
  #idle { transition: opacity .3s ease; }
  /* The talking face: her photo with the jaw moved in time with her voice (WebGL, see below). */
  #mouth { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .3s ease; }
  .face.gl #mouth { opacity: 1; }
  .face.gl.talking #mouth { animation: sway 3.2s ease-in-out infinite; }
  .face.talking #idle { opacity: 0; }
  @keyframes sway { 0%,100% { transform: scale(1.012) translateY(0) rotate(0); } 33% { transform: scale(1.016) translateY(-3px) rotate(.25deg); } 66% { transform: scale(1.014) translateY(2px) rotate(-.2deg); } }
  .face::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 0 var(--lime); transition: box-shadow .25s; pointer-events: none; }
  .speaking .face::after { box-shadow: inset 0 0 0 5px var(--lime); }
  .thinking .face::after { box-shadow: inset 0 0 0 3px rgba(214,255,61,.45); }
  .side { position: relative; flex: 1; padding: 40px 44px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .brand { position: absolute; top: 32px; left: 44px; font-size: 18px; color: var(--muted); }
  .brand b { color: var(--ink); }
  .name { font-size: 44px; font-weight: 600; letter-spacing: -.5px; }
  .role { font-size: 20px; color: var(--muted); margin-top: 6px; }
  .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: var(--panel); font-size: 18px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .speaking .dot, .thinking .dot { background: var(--lime); }
  .caption { font-size: 26px; line-height: 1.35; min-height: 140px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="face" id="face">
    <img src="cora-1024.jpg?v=2" alt="Cora Whitley">
    <video id="idle" src="cora-idle.mp4?v=1" muted loop playsinline autoplay preload="auto"></video>
    <canvas id="mouth" width="1024" height="1024"></canvas>
  </div>
  <div class="side">
    <div class="brand"><b>ForgeX</b> · AI Chief of Staff</div>
    <div>
      <div class="name">Cora Whitley</div>
      <div class="role" id="role">Say "Cora" and ask me anything</div>
    </div>
    <div class="pill"><span class="dot"></span><span id="status">Listening</span></div>
    <div class="caption" id="caption"></div>
  </div>
</div>

<script type="module">
// Cora's in-meeting page. Recall.ai renders this as the bot's camera and gives it the meeting audio as
// its microphone. We read Recall's live transcript and only open an ElevenLabs voice session when
// someone says "Cora", so voice minutes are billed only while she is talking.
import { Conversation } from "https://esm.sh/@elevenlabs/client@0";

const FN = "https://cbtbnjbdcdqmvlolzdlt.supabase.co/functions/v1/cora-voice";
const q = new URLSearchParams(location.search);
const N = q.get("n"), T = q.get("t"), TITLE = q.get("title") || "a meeting";
const WAKE = /\b(cora|kora|korah|corah|quora|coura|corra)\b/i;
const SELF = /cora \(forgex/i;

const stage = document.getElementById("stage");
const statusEl = document.getElementById("status");
const captionEl = document.getElementById("caption");
const setState = (s, label) => { stage.className = "stage " + s; statusEl.textContent = label; };

const transcript = [];   // [{speaker, text}]
let convo = null, starting = false, captionTimer = null;
let pending = null;      // the utterance that woke Cora: {speaker, text, timer, sent}
let alreadySpoke = false; // Cora has spoken in this meeting (no second introduction)
let followUntil = 0;      // after Cora answers, her asker can follow up without saying "Cora" again
let idleTimer = null;     // close the session once Cora is done, so room talk never reaches her

function remember(speaker, text) {
  transcript.push({ speaker, text });
  while (transcript.length > 40) transcript.shift();
}
const recent = () => transcript.slice(-25).map((u) => `${u.speaker}: ${u.text}`).join("\n") || "(nothing yet)";

function showCaption(text) {
  captionEl.textContent = text;
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => (captionEl.textContent = ""), 9000);
}

// ---- Avatar. Listening: a looping clip of her blinking and nodding (cora-idle.mp4, if present).
// Talking: her photo drawn in WebGL with the jaw opened by the loudness of her voice, frame by frame,
// so the mouth moves with each syllable and closes in the pauses. All of it runs in this page.
const face = document.getElementById("face");
const idleV = document.getElementById("idle");
idleV.addEventListener("canplay", () => { idleV.classList.add("on"); idleV.play().catch(() => {}); }, { once: true });
idleV.addEventListener("error", () => idleV.remove());

const mouth = (() => {
  const cv = document.getElementById("mouth");
  const gl = cv.getContext("webgl", { premultipliedAlpha: false });
  if (!gl) return null;
  const vs = `attribute vec2 p; varying vec2 uv; void main(){ uv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
  // Coordinates are in the 1024px photo. The split line runs along the bottom of the upper teeth and
  // curves up to the mouth corners. Everything below it (lower lip, chin) slides down by D, fading
  // out toward the jawline; the gap that opens is the inside of the mouth.
  const fs = `precision mediump float; varying vec2 uv; uniform sampler2D img; uniform float openPx;
    void main(){
      vec2 px = uv * 1024.;
      float dx = px.x - 531.;
      float split = 459. - 20. * pow(clamp(abs(dx) / 70., 0., 1.), 2.);
      float wx = 1. - smoothstep(48., 96., abs(dx));
      float wy = 1. - smoothstep(505., 585., px.y);
      float D = openPx * wx;
      vec4 col = texture2D(img, uv);
      if (px.y > split && D > .01) {
        float sy = px.y - D * wy;
        if (sy < split) {
          float g = (px.y - split) / max(D, 1.);              // 0 at the upper teeth, 1 at the lower lip
          vec3 inside = mix(vec3(.16,.05,.06), vec3(.33,.12,.13), smoothstep(.0, .9, g) * (1. - smoothstep(30., 70., abs(dx))));
          inside = mix(inside, vec3(.82,.79,.75), smoothstep(.72, 1., g) * .55 * (1. - smoothstep(25., 55., abs(dx)))); // lower teeth hint
          float edge = smoothstep(0., 2.5, px.y - split);
          col = vec4(mix(texture2D(img, vec2(uv.x, (split - .5) / 1024.)).rgb, inside, edge), 1.);
        } else {
          col = texture2D(img, vec2(uv.x, sy / 1024.));
        }
      }
      gl_FragColor = col;
    }`;
  const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uOpen = gl.getUniformLocation(pr, "openPx");
  const tex = gl.createTexture();
  let loaded = false;
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    loaded = true; draw(0);
  };
  img.src = "cora-1024.jpg?v=2";
  function draw(openPx) { if (!loaded) return; gl.viewport(0, 0, 1024, 1024); gl.uniform1f(uOpen, openPx); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
  return { draw, ok: () => loaded };
})();

let ac = null, ttsAnalyser = null, ttsBuf = null;
function ttsLevel() {
  if (!ttsAnalyser) return 0;
  ttsAnalyser.getByteTimeDomainData(ttsBuf);
  let sum = 0; for (const b of ttsBuf) { const x = (b - 128) / 128; sum += x * x; }
  return Math.sqrt(sum / ttsBuf.length);
}
// Route a spoken <audio> through an analyser so the face can follow it. It still plays out loud.
function trackAudio(el) {
  try {
    ac = ac || new AudioContext();
    const src = ac.createMediaElementSource(el);
    ttsAnalyser = ac.createAnalyser(); ttsAnalyser.fftSize = 512; ttsAnalyser.smoothingTimeConstant = 0;
    ttsBuf = new Uint8Array(ttsAnalyser.fftSize);
    src.connect(ttsAnalyser); ttsAnalyser.connect(ac.destination);
    ac.resume?.();
  } catch (e) { ttsAnalyser = null; }
}
let lastVoice = -1e9, open = 0;
const MAX_OPEN = 24;  // px of jaw drop at full volume, in the 1024px photo
function avatarTick() {
  let level = ttsLevel();
  try { if (convo) level = Math.max(level, (convo.getOutputVolume?.() || 0) * 0.5); } catch {}
  const now = performance.now();
  if (level > 0.02) lastVoice = now;
  // Fast open, slower close, like a real jaw. Small jitter so held vowels don't look frozen.
  const target = Math.min(1, Math.max(0, (level - 0.015) * 7)) * (0.85 + 0.15 * Math.sin(now / 47));
  open += (target - open) * (target > open ? 0.55 : 0.25);
  const talking = now - lastVoice < 900;      // stay on the talking face through short pauses
  if (mouth) {
    face.classList.toggle("gl", talking || !idleV.isConnected || !idleV.classList.contains("on"));
    mouth.draw(open * MAX_OPEN);
  }
  face.classList.toggle("talking", talking);
  requestAnimationFrame(avatarTick);
}
requestAnimationFrame(avatarTick);
// Local check: coraPlay("some.wav") plays a file through the face.
window.coraPlay = async (url) => {
  const audio = new Audio(url); trackAudio(audio); setState("speaking", "Speaking");
  await new Promise((done) => { audio.onended = done; audio.onerror = done; audio.play().catch(done); });
  setState("", "Listening");
};
// Preview without a meeting: ?demo=1 plays a line so the face can be checked.
window.coraDemo = async (text = "Hi everyone, I'm Cora, ForgeX's AI chief of staff. Great to be co-hosting with Davis today.") => {
  const a = await fetch(`${FN}/tts`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ meeting_key: `${N}.${T}`, text }) });
  if (!a.ok) return console.warn("tts", a.status);
  const audio = new Audio(URL.createObjectURL(await a.blob()));
  trackAudio(audio); setState("speaking", "Speaking"); showCaption(text);
  await new Promise((done) => { audio.onended = done; audio.onerror = done; audio.play().catch(done); });
  setState("", "Listening");
};

// Speed: connect the moment we hear "Cora" (even mid-sentence), with the mic muted. When the speaker
// finishes, hand over the full question as text and unmute for follow-ups. Avoids a double answer
// from the voice channel and saves the connection time.
async function connect(speaker) {
  if (convo || starting) return;
  starting = true;
  setState("thinking", "Listening");
  try {
    const r = await fetch(`${FN}/session`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ n: N, t: T }) });
    const { signed_url, internal, room } = await r.json();
    if (!signed_url) throw new Error("no session");
    convo = await Conversation.startSession({
      signedUrl: signed_url,
      dynamicVariables: { meeting_title: TITLE, asked_by: speaker || "someone", recent_transcript: recent(), meeting_key: `${N}.${T}`, meeting_internal: internal ? "yes" : "no (outsiders may be present)", meeting_room: room || "Unknown room: assume outsiders may be present.", already_spoke: alreadySpoke ? "yes" : "no" },
      // The mic stays muted for the whole session: Cora only hears what is addressed to her, as text.
      // An open mic fed the whole room to her as one endless turn, so she never got to finish a task.
      onModeChange: ({ mode }) => {
        setState(mode === "speaking" ? "speaking" : "", mode === "speaking" ? "Speaking" : "Listening");
        if (mode === "speaking") alreadySpoke = true;
        if (mode === "listening" && pending?.sent) followUntil = Date.now() + 12000;
        touch();
      },
      onMessage: ({ source, message }) => { if (source === "ai" && message) { showCaption(message); remember("Cora", message); } touch(); },
      onDisconnect: () => { convo = null; pending = null; clearTimeout(idleTimer); setState("", "Listening"); },
      onError: () => { convo = null; pending = null; clearTimeout(idleTimer); setState("", "Listening"); },
    });
    convo.setMicMuted(true);
    if (pending?.ready) send();
  } catch (e) {
    console.error(e);
    convo = null;
    setState("", "Listening");
  } finally {
    starting = false;
  }
}

function send() {
  if (!pending || pending.sent || !convo) return;
  pending.sent = true;
  setState("thinking", "Thinking");
  convo.sendUserMessage(`${pending.speaker || "Someone"} said: "${pending.text}"`);
  touch();
}

// End the session after 30s with nothing from Cora and nobody talking to her. Tool calls keep it
// alive (each agent message resets the clock), and saying "Cora" opens a fresh one.
function touch() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (convo) { try { convo.endSession(); } catch {} } }, 30000);
}

// The utterance is done when the transcript says it is final, or when it stops changing for 700ms.
function settle() {
  if (!pending) return;
  pending.ready = true;
  remember(pending.speaker || "Someone", pending.text);
  send();
}

let heard = function (speaker, text, final) {
  const waking = WAKE.test(text);
  // Session already open: pass along only what's addressed to Cora (her name, or her asker
  // following up right after she answered). Everything else in the room stays out.
  if (convo && pending?.sent) {
    if (final && (waking || (Date.now() < followUntil && speaker === pending.speaker))) {
      remember(speaker || "Someone", text);
      convo.sendUserMessage(`${speaker || "Someone"} said: "${text}"`);
      followUntil = 0;
      touch();
    } else if (final) remember(speaker || "Someone", text);
    return;
  }
  if (waking && !pending && !convo) pending = { speaker, text, sent: false, ready: false };
  if (pending && !pending.ready && (speaker === pending.speaker || !speaker)) {
    pending.text = text;
    clearTimeout(pending.timer);
    if (final) settle();
    else pending.timer = setTimeout(settle, 700);
  } else if (final) remember(speaker || "Someone", text);
  if (waking) connect(speaker);
}

function words(msg) {
  const d = msg?.transcript ?? msg?.data?.data ?? msg?.data ?? msg;
  const w = d?.words ?? [];
  const speaker = d?.speaker ?? d?.participant?.name ?? "";
  const isHost = d?.participant?.is_host === true;
  const ev = String(msg?.event ?? "");
  const final = d?.is_final === false || /partial/.test(ev) ? false : true;
  return { text: w.map((x) => x.text).join(" ").trim(), speaker, final, isHost };
}

function connectTranscript() {
  const ws = new WebSocket("wss://meeting-data.bot.recall.ai/api/v1/transcript");
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    const { text, speaker, final, isHost } = words(msg);
    if (!text || SELF.test(speaker)) return;
    // Tell the server who is addressing Cora, so actions on Davis's behalf only follow the host.
    if (final && WAKE.test(text)) {
      fetch(`${FN}/heard`, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ meeting_key: `${N}.${T}`, speaker, is_host: isHost, text }) }).catch(() => {});
    }
    heard(speaker, text, final);
  };
  ws.onclose = () => setTimeout(connectTranscript, 1500);
}

// Results Cora's team finishes during the call come back as a "say" queue. Speak each one at a
// natural pause (nobody talking for 1.5s), never over a live conversation with Cora.
let lastHeard = Date.now(), speakingOut = false;
const _heard = heard;
heard = (speaker, text, final) => { lastHeard = Date.now(); _heard(speaker, text, final); };
async function sayLoop() {
  try {
    if (!convo && !starting && !speakingOut && Date.now() - lastHeard > 1500) {
      const r = await fetch(`${FN}/say-next`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ meeting_key: `${N}.${T}` }) });
      const { say } = await r.json();
      if (say) {
        speakingOut = true;
        const a = await fetch(`${FN}/tts`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ meeting_key: `${N}.${T}`, text: say }) });
        if (a.ok) {
          const audio = new Audio(URL.createObjectURL(await a.blob()));
          trackAudio(audio);
          setState("speaking", "Speaking");
          showCaption(say);
          remember("Cora", say);
          await new Promise((done) => { audio.onended = done; audio.onerror = done; audio.play().catch(done); });
        }
        speakingOut = false;
        setState("", "Listening");
      }
    }
  } catch (e) { speakingOut = false; }
  setTimeout(sayLoop, 2500);
}

if (!N || !T) setState("", "Not connected");
else { setState("", "Listening"); connectTranscript(); sayLoop(); }
</script>
</body>
</html>
