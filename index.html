<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://cbtbnjbdcdqmvlolzdlt.supabase.co wss://meeting-data.bot.recall.ai https://api.elevenlabs.io wss://api.elevenlabs.io https://livekit.rtc.elevenlabs.io wss://livekit.rtc.elevenlabs.io https://api.simli.ai wss://api.simli.ai https://*.livekit.cloud wss://*.livekit.cloud https://cloud-api.livekit.io; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Cora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0f14; --panel: #121821; --ink: #f4f6f8; --muted: #8a94a3; --lime: #d6ff3d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Geist, system-ui, sans-serif; }
  .stage { position: relative; width: 1280px; height: 720px; }
  /* Full-frame webcam view: her photo cropped to 16:9, with a lower-third and subtitles on top. */
  .face { position: absolute; inset: 0; overflow: hidden; background: #2a2622; }
  .face img, .face canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* One photo, brought to life in the canvas below: breathing always, a little more movement while talking. */
  @keyframes breathe { 0%,100% { transform: scale(1.01) translateY(0); } 50% { transform: scale(1.016) translateY(-2px); } }
  @keyframes sway { 0%,100% { transform: scale(1.014) translateY(0) rotate(0); } 30% { transform: scale(1.018) translateY(-3px) rotate(.35deg); } 65% { transform: scale(1.016) translateY(1px) rotate(-.3deg); } }
  .face::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 0 var(--lime); transition: box-shadow .25s; pointer-events: none; }
  .speaking .face::after { box-shadow: inset 0 0 0 5px var(--lime); }
  .thinking .face::after { box-shadow: inset 0 0 0 3px rgba(214,255,61,.45); }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(to top, rgba(8,10,14,.82), rgba(8,10,14,0)); pointer-events: none; }
  .lower { position: absolute; left: 44px; bottom: 40px; display: flex; align-items: center; gap: 18px; }
  .name { font-size: 34px; font-weight: 600; letter-spacing: -.4px; }
  .role { font-size: 18px; color: #c9d0d9; margin-top: 2px; }
  .role b { color: var(--ink); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 9px; padding: 8px 15px; border-radius: 999px; background: rgba(18,24,33,.75); font-size: 16px; color: #c9d0d9; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .speaking .dot, .thinking .dot { background: var(--lime); }
  .caption { position: absolute; left: 160px; right: 160px; bottom: 132px; text-align: center; font-size: 28px; line-height: 1.35; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .caption:empty { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="face" id="face">
    <canvas id="mouth" width="1280" height="720"></canvas>
    <video id="sim" autoplay playsinline muted style="display:none"></video>
    <video id="talk" muted playsinline preload="none" style="display:none"></video>
    <audio id="simAudio" autoplay></audio>
  </div>
  <div class="shade"></div>
  <div class="caption" id="caption"></div>
  <div class="lower">
    <div>
      <div class="name">Cora Whitley</div>
      <div class="role"><b>ForgeX</b> · GTM Analyst &amp; Chief of Staff</div>
    </div>
    <div class="pill"><span class="dot"></span><span id="status">Listening</span></div>
  </div>
</div>

<script src="elevenlabs-client-0.16.0.js" integrity="sha384-8vXUANjslurgiINu2hlXv6Mpj+Y6SJKznDV48YgjInMw0jziAC25NusFUS8/J0JI" crossorigin="anonymous"></script>
<script type="module" src="cora.js"></script>
</body>
</html>
